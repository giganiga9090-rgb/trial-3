<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu</title>
  <style>
    body {
      font-family: 'Courier New', Courier, monospace;
      background-color: #ffffff;
      color: #000000;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-size: 3rem;
      letter-spacing: 6px;
      margin-bottom: 40px;
      text-transform: uppercase;
      border-bottom: 3px solid #000000;
      padding-bottom: 10px;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 30px;
      width: 100%;
      max-width: 1000px;
    }

    /* Photobooth Card (Dark style for white background) */
    .photobooth-card {
      background-color: #111111;
      color: #ffffff;
      padding: 15px 15px 20px 15px;
      border-radius: 4px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.2s ease;
    }

    .photobooth-card:hover {
      transform: translateY(-5px);
    }

    .image-container {
      width: 100%;
      height: 220px;
      background-color: #222222;
      overflow: hidden;
      cursor: pointer;
    }

    .image-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity 0.2s ease;
    }

    .image-container img:hover {
      opacity: 0.9;
    }

    .card-title {
      margin-top: 15px;
      font-size: 1.1rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-align: center;
    }

    /* Fullscreen Modal / Zoom Overlay */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.85);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal img {
      max-width: 90%;
      max-height: 85%;
      border: 6px solid #ffffff;
      border-radius: 4px;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.5);
    }

    .modal-close {
      position: absolute;
      top: 20px;
      right: 35px;
      color: #ffffff;
      font-size: 40px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>MENU</h1>

  <div class="menu-grid" id="menu"></div>

  <div class="modal" id="imageModal" onclick="closeModal()">
    <span class="modal-close">&times;</span>
    <img id="modalImg" src="" alt="Enlarged view">
  </div>

  <script>
    const items = [
      { name: "French Fries", file: "french fries.jpg" },
      { name: "Pancakes", file: "pancakes.jpg" },
      { name: "Burger Combo", file: "burger combo.webp" },
      { name: "Duo Smash", file: "duo smash.jpg" }
    ];

    const menuContainer = document.getElementById('menu');

    items.forEach(item => {
      const imagePath = `images/${encodeURI(item.file)}`;

      const card = document.createElement('div');
      card.className = 'photobooth-card';
      card.innerHTML = `
        <div class="image-container" onclick="zoomImage('${imagePath}')">
          <img src="${imagePath}" alt="${item.name}">
        </div>
        <div class="card-title">${item.name}</div>
      `;
      menuContainer.appendChild(card);
    });

    function zoomImage(src) {
      document.getElementById('modalImg').src = src;
      document.getElementById('imageModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('imageModal').style.display = 'none';
    }
  </script>

</body>
</html>
